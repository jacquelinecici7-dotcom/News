name: Daily Briefing

on:
  # 8am Beijing = 0:00 UTC (China Standard Time, no DST).
  schedule:
    - cron: '0 0 * * *'
  # Manual trigger for ad-hoc runs / debugging.
  workflow_dispatch:

permissions:
  contents: write

# Don't cancel an in-flight run if a new one starts; just let it finish.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Need history for the dedup state diffs to make sense.
          fetch-depth: 0

      - name: Install PowerShell Core
        uses: microsoft/powershell@v1

      - name: Run briefing collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File briefing/Invoke-Briefing.ps1 -Merge -Force -GitHubActions 2>&1
          # Don't fail the job just because the script's last exit code isn't 0;
          # we still want to commit whatever HTML got generated for debugging.
          echo "::notice::script exit code: $LASTEXITCODE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ 今日资讯.html
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "briefing: $(date -u +%Y-%m-%d)"
            git push
          fi
